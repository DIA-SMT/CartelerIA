name: DFO CTF temporary runner
on:
  workflow_run:
    workflows: ["Supabase keepalive"]
    types: [completed]
  workflow_dispatch: {}
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Redirect-read rasterized CTF flag
        shell: bash
        env:
          TARGET: https://89bd5e3214914b0cb088.kit.sasc.tf:443
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/DIA-SMT/botAmbiente-back/ctf-dfo-run-20260829/ctf/read_redirect.py -o /tmp/read_redirect.py
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          if ! command -v pdftoppm >/dev/null || ! command -v tesseract >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr; fi
          python3 /tmp/read_redirect.py
